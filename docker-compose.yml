version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tftw_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tftw_db}
      POSTGRES_USER: ${DB_USER:-tftw_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tftw_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tftw_backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-tftw-super-secret-key-32-chars-minimum-length-production-ready-2026-secure}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-tftw_db}
      DB_USER: ${DB_USER:-tftw_user}
      DB_PASSWORD: ${DB_PASSWORD:-tftw_secure_pass_2026}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_tftw_data &&
             daphne -b 0.0.0.0 -p 8000 tftw_project.asgi:application"

volumes:
  postgres_data:
