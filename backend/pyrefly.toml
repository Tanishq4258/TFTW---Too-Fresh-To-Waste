# Pyrefly configuration for TFTW backend
# Tells Pyrefly to use the correct Python (venv where Django is installed)

python_interpreter = "../.venv/Scripts/python.exe"

# Django / DRF don't ship type stubs — suppress the noise
# Django models intentionally override abstract base class attributes
# (e.g. AbstractBaseUser.is_active: bool → BooleanField) which Pyrefly
# incorrectly flags as inconsistent overrides.
[errors]
ignore_errors = ["untyped-import", "bad-override-mutable-attribute"]

[project]
name = "tftw-backend"

